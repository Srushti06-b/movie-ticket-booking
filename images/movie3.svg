<?xml version="1.0" encoding="utf-8"?>
<!-- Animated Movie Poster - Cinema Masterpiece -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="posterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4d4d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="glowGradient">
      <stop offset="0%" style="stop-color:#ffaa00;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffaa00;stop-opacity:0" />
    </radialGradient>

    <linearGradient id="shimmerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0" />
    </linearGradient>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes shimmer {
        0% { transform: translateX(-150%); }
        100% { transform: translateX(150%); }
      }
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 170, 0, 0.6)); }
        50% { filter: drop-shadow(0 0 25px rgba(255, 170, 0, 1)); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .poster-container { animation: float 4s ease-in-out infinite; }
      .title-text { animation: glow 2.5s ease-in-out infinite; }
      .shimmer-bar { animation: shimmer 3s linear infinite; }
      .star-ornament { animation: rotate 6s linear infinite; }
      .pulse-glow { animation: pulse 1.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="#0a0e27"/>
  
  <!-- Subtle background pattern -->
  <circle cx="150" cy="100" r="200" fill="url(#glowGradient)"/>
  <circle cx="500" cy="700" r="250" fill="url(#glowGradient)"/>

  <!-- Main Poster Container with Float Animation -->
  <g class="poster-container">
    <!-- Poster Frame -->
    <rect x="40" y="50" width="520" height="680" rx="12" fill="url(#posterGradient)" stroke="#ffcc00" stroke-width="3"/>
    
    <!-- Poster Inner Shadow -->
    <rect x="45" y="55" width="510" height="670" rx="10" fill="#1a1a3e" opacity="0.95"/>
    
    <!-- Shimmer Effect Bar -->
    <rect x="45" y="55" width="510" height="670" rx="10" fill="url(#shimmerGradient)" class="shimmer-bar"/>
  </g>

  <!-- Movie Title Section with Glow -->
  <g class="title-text">
    <!-- Title Background -->
    <rect x="50" y="60" width="500" height="140" fill="#000000" opacity="0.7" rx="8"/>
    
    <!-- Main Title -->
    <text x="300" y="120" font-size="56" font-weight="bold" text-anchor="middle" fill="#ffaa00" font-family="Poppins, Arial">
      CINEMA
    </text>
    <text x="300" y="170" font-size="44" font-weight="600" text-anchor="middle" fill="#ffffff" font-family="Poppins, Arial">
      MASTERPIECE
    </text>
  </g>

  <!-- Decorative Star Elements -->
  <g class="star-ornament" style="transform-origin: 300px 230px">
    <circle cx="280" cy="220" r="4" fill="#ffaa00"/>
    <circle cx="320" cy="220" r="4" fill="#ffaa00"/>
    <circle cx="300" cy="200" r="5" fill="#ffcc00"/>
  </g>

  <!-- Main Poster Visual Area -->
  <g>
    <!-- Poster Art Frame -->
    <rect x="60" y="210" width="480" height="350" rx="8" fill="#2a2a5e" stroke="#ffaa00" stroke-width="2"/>
    
    <!-- Spotlight Effects -->
    <circle cx="300" cy="280" r="80" fill="#ffaa00" opacity="0.15" class="pulse-glow"/>
    <circle cx="300" cy="280" r="50" fill="#ffcc00" opacity="0.2"/>
    
    <!-- Movie Scene Elements (Abstract) -->
    <rect x="80" y="230" width="70" height="100" fill="#ff6b6b" opacity="0.6" rx="4"/>
    <rect x="250" y="250" width="100" height="120" fill="#ffaa00" opacity="0.5" rx="4"/>
    <rect x="450" y="240" width="60" height="110" fill="#ff4d4d" opacity="0.7" rx="4"/>
    
    <!-- Cinematic Grid Lines -->
    <line x1="200" y1="210" x2="200" y2="560" stroke="#ffaa00" stroke-width="1" opacity="0.3"/>
    <line x1="400" y1="210" x2="400" y2="560" stroke="#ffaa00" stroke-width="1" opacity="0.3"/>
    <line x1="60" y1="310" x2="540" y2="310" stroke="#ffaa00" stroke-width="1" opacity="0.3"/>
    <line x1="60" y1="435" x2="540" y2="435" stroke="#ffaa00" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Movie Details Section -->
  <g>
    <!-- Details Background -->
    <rect x="60" y="570" width="480" height="140" fill="#1a1a3e" rx="8" stroke="#ffaa00" stroke-width="1" opacity="0.5"/>
    
    <!-- Rating -->
    <text x="300" y="600" font-size="20" font-weight="700" text-anchor="middle" fill="#ffcc00" font-family="Poppins, Arial" class="pulse-glow">
      ★★★★★ 9.5/10
    </text>
    
    <!-- Genre & Duration -->
    <text x="300" y="635" font-size="16" text-anchor="middle" fill="#e0e0e0" font-family="Poppins, Arial">
      ACTION • THRILLER • 2h 15m
    </text>
    
    <!-- Release Info -->
    <text x="300" y="665" font-size="14" text-anchor="middle" fill="#b0b0b0" font-family="Poppins, Arial">
      Coming Soon • English • PG-13
    </text>
    
    <!-- Special Badge -->
    <circle cx="120" cy="695" r="20" fill="#ff4d4d" opacity="0.8" class="pulse-glow"/>
    <text x="120" y="700" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Poppins, Arial">
      NEW
    </text>
  </g>

  <!-- Bottom Border Animation -->
  <rect x="50" y="720" width="500" height="4" rx="2" fill="#ffaa00" class="shimmer-bar"/>
  
  <!-- Footer Decorative Elements -->
  <circle cx="100" cy="770" r="3" fill="#ffaa00" opacity="0.8"/>
  <circle cx="300" cy="770" r="3" fill="#ffcc00" opacity="0.8"/>
  <circle cx="500" cy="770" r="3" fill="#ffaa00" opacity="0.8"/>
</svg>