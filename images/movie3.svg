<path d="M-160,160 C-140,110 -120,90 -70,120 C-60,128 60,128 70,120 C120,90 140,110 160,160" fill="none" stroke="#062033" stroke-width="2" opacity="0.6"/>

<!-- reflective code fragments over chest -->
