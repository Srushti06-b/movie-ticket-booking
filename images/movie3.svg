<linearGradient id="navyGlow" x1="0" x2="1" y1="0" y2="1">
  <stop offset="0%" stop-color="#041231" stop-opacity="0.9"/>
  <stop offset="100%" stop-color="#020617" stop-opacity="0.65"/>
</linearGradient>

<radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#6cf" stop-opacity="0.9"/>
  <stop offset="40%" stop-color="#06f" stop-opacity="0.25"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>

<radialGradient id="redNeon" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#ff4b6e" stop-opacity="0.95"/>
  <stop offset="60%" stop-color="#ff0022" stop-opacity="0.25"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>

<!-- Filters -->
<filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="6" result="b"/>
  <feBlend in="SourceGraphic" in2="b" mode="normal"/>
</filter>

<filter id="glowBlue" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="12" result="b"/>
  <feMerge>
    <feMergeNode in="b"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="glowRed" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="8" result="b"/>
  <feMerge>
    <feMergeNode in="b"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<!-- Mask for reflection -->
<linearGradient id="fadeMask" x1="0" x2="0" y1="0" y2="1">
  <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
  <stop offset="40%" stop-color="#fff" stop-opacity="0.2"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<mask id="titleFade">
  <rect x="0" y="0" width="600" height="200" fill="url(#fadeMask)"/>
</mask>

<!-- City silhouette -->
<linearGradient id="cityGrad" x1="0" x2="0" y1="0" y2="1">
  <stop offset="0%" stop-color="#07122a" />
  <stop offset="100%" stop-color="#000000" />
</linearGradient>

<!-- Reusable raindrop path -->
<path id="raindrop" d="M0 0 L2 14" stroke-linecap="round" />

<!-- Code pattern for screens -->
<pattern id="codePattern" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
  <rect width="12" height="12" fill="rgba(0,0,0,0)"/>
  <rect x="1" y="1" width="10" height="2" fill="#09f" opacity="0.95" />
  <rect x="1" y="5" width="8" height="1.2" fill="#6cf" opacity="0.85" />
  <rect x="1" y="8" width="9" height="1.2" fill="#05d" opacity="0.9" />
  <rect x="1" y="10" width="6" height="1.2" fill="#0ff" opacity="0.6" />
</pattern>

<!-- Unique ID for clipping the silhouette reflection -->
<clipPath id="silClip">
  <rect x="120" y="160" width="360" height="440" rx="20" ry="20"/>
</clipPath>

<!-- Subtle vignette -->
<radialGradient id="vignette" cx="50%" cy="35%" r="70%">
  <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
</radialGradient>

<!-- Typography style as shape fallback stroke -->
<filter id="textEmboss">
  <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
  <feOffset dx="0" dy="2" result="off"/>
  <feComposite in="off" in2="SourceGraphic" operator="out" result="comp"/>
  <feMerge>
    <feMergeNode in="comp"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
<!-- Right vertical screen -->
<g transform="translate(380,120) rotate(6)">
  <rect class="screen screenPulse" x="0" y="0" width="170" height="220" rx="8" ry="8" />
  <rect x="10" y="10" width="150" height="200" rx="4" ry="4" fill="#001122" opacity="0.75"/>
  <!-- Code lines -->
  <g transform="translate(18,20)" class="codeText">
    <text x="0" y="0" style="font-size:12px; fill:#06f;">function decrypt(input) {</text>
    <text x="0" y="18" style="font-size:12px; fill:#6cf;">  var key = deriveKey(seed);</text>
    <text x="0" y="36" style="font-size:12px; fill:#06f;" class="flicker">  // retrieving fragments...</text>
    <text x="0" y="54" style="font-size:12px; fill:#9ff;">  return xor(input, key);</text>
    <text x="0" y="72" style="font-size:12px; fill:#6cf;">}</text>
    <text x="0" y="96" style="font-size:11px; fill:#05f;" opacity="0.85">/* stream: 0x7a9b... */</text>
    <text x="0" y="114" style="font-size:11px; fill:#0ff;" opacity="0.7">> echo $TOKEN</text>
  </g>
  <!-- small top-right camera red dot -->
  <circle cx="150" cy="14" r="3" fill="#ff4b6e" opacity="0.9" class="redPulse"/>
</g>

<!-- Floating transparent HUD -->
<g transform="translate(140,90)" opacity="0.35">
  <rect x="0" y="0" width="320" height="620" rx="20" ry="20" fill="transparent"/>
  <g stroke="#06f" stroke-opacity="0.08" stroke-width="1">
    <rect x="20" y="20" width="280" height="560" rx="12" ry="12" fill="none"/>
    <line x1="20" y1="70" x2="300" y2="70" />
    <circle cx="50" cy="100" r="18" />
  </g>
</g>
