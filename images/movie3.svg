<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <defs>
    <style>
      @keyframes shimmerEffect {
        0% { transform: translateX(-100%); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateX(100%); opacity: 0; }
      }
      
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(255, 107, 107, 0.5)); }
        50% { filter: drop-shadow(0 0 15px rgba(255, 107, 107, 0.9)); }
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      
      @keyframes rotateStar {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      
      @keyframes borderFlow {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      
      .poster-main { animation: float 3s ease-in-out infinite; }
      .title-glow { animation: glow 2s ease-in-out infinite; }
      .shimmer { animation: shimmerEffect 2.5s infinite; }
      .star-anim { animation: rotateStar 4s linear infinite; transform-origin: 200px 120px; }
      .pulse-badge { animation: pulse 1.5s ease-in-out infinite; }
    </style>
    
    <!-- Gradients -->
    <linearGradient id="posterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff1744;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff5252;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d32f2f;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffeb3b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd600;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    
    <radialGradient id="glowRad">
      <stop offset="0%" style="stop-color:#ffeb3b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff1744;stop-opacity:0" />
    </radialGradient>
    
    <filter id="shadowFilter">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Background -->
  <circle cx="200" cy="300" r="250" fill="url(#glowRad)"/>

  <!-- Main Poster Container with Float Animation -->
  <g class="poster-main">
    <!-- Poster Frame Outer Border -->
    <rect x="30" y="30" width="340" height="480" rx="12" ry="12" 
          fill="url(#posterGrad)" stroke="#ffeb3b" stroke-width="3" filter="url(#shadowFilter)"/>
    
    <!-- Poster Inner Background -->
    <rect x="36" y="36" width="328" height="468" rx="10" ry="10" 
          fill="#0f0f2e" opacity="0.95"/>
    
    <!-- Shimmer Effect Layer -->
    <g class="shimmer">
      <rect x="36" y="36" width="328" height="468" rx="10" ry="10" 
            fill="url(#shimmerGrad)" opacity="0.6"/>
    </g>
  </g>

  <!-- Top Decorative Bar -->
  <rect x="30" y="30" width="340" height="8" rx="4" fill="url(#titleGrad)"/>

  <!-- Title Section with Glow -->
  <g class="title-glow">
    <!-- Title Background -->
    <rect x="40" y="50" width="320" height="100" rx="8" fill="#000000" opacity="0.6"/>
    
    <!-- Main Title -->
    <text x="200" y="105" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
          text-anchor="middle" fill="url(#titleGrad)">BLOCKBUSTER</text>
    
    <!-- Subtitle -->
    <text x="200" y="135" font-family="Arial, sans-serif" font-size="20" font-weight="600"
          text-anchor="middle" fill="#ffffff">Coming This Summer</text>
  </g>

  <!-- Animated Stars Decoration -->
  <g class="star-anim">
    <!-- Center Star -->
    <polygon points="200,105 210,125 232,125 215,140 223,160 200,145 177,160 185,140 168,125 190,125" 
             fill="#ffeb3b" opacity="0.9"/>
    <!-- Side Stars -->
    <circle cx="150" cy="100" r="3" fill="#ffd600" opacity="0.8"/>
    <circle cx="250" cy="100" r="3" fill="#ffd600" opacity="0.8"/>
  </g>

  <!-- Movie Poster Content Area -->
  <g>
    <!-- Main Visual Frame -->
    <rect x="50" y="160" width="300" height="220" rx="8" fill="#1a1a3e" 
          stroke="#ff5252" stroke-width="2" opacity="0.8"/>
    
    <!-- Spotlight Effect 1 -->
    <circle cx="150" cy="200" r="60" fill="#ff1744" opacity="0.2"/>
    
    <!-- Spotlight Effect 2 -->
    <circle cx="250" cy="240" r="50" fill="#ffeb3b" opacity="0.15"/>
    
    <!-- Visual Elements -->
    <rect x="70" y="180" width="60" height="120" fill="#ff5252" opacity="0.5" rx="4"/>
    <rect x="170" y="170" width="80" height="140" fill="#ffeb3b" opacity="0.4" rx="4"/>
    <rect x="280" y="190" width="50" height="100" fill="#ff1744" opacity="0.6" rx="4"/>
    
    <!-- Grid Lines -->
    <line x1="150" y1="160" x2="150" y2="380" stroke="#ffeb3b" stroke-width="1" opacity="0.2"/>
    <line x1="250" y1="160" x2="250" y2="380" stroke="#ffeb3b" stroke-width="1" opacity="0.2"/>
    <line x1="50" y1="230" x2="350" y2="230" stroke="#ff5252" stroke-width="1" opacity="0.2"/>
    <line x1="50" y1="300" x2="350" y2="300" stroke="#ff5252" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Details Section -->
  <g>
    <!-- Details Background -->
    <rect x="40" y="390" width="320" height="100" rx="8" fill="#000000" opacity="0.5"
          stroke="#ffeb3b" stroke-width="1" opacity="0.3"/>
    
    <!-- Rating with Pulse -->
    <g class="pulse-badge">
      <text x="200" y="420" font-family="Arial, sans-serif" font-size="18" font-weight="bold"
            text-anchor="middle" fill="#ffeb3b">★★★★★ 9.5/10</text>
    </g>
    
    <!-- Genre -->
    <text x="200" y="450" font-family="Arial, sans-serif" font-size="14" text-anchor="middle"
          fill="#e0e0e0">ACTION • ADVENTURE • 2h 30m</text>
    
    <!-- Release Info -->
    <text x="200" y="475" font-family="Arial, sans-serif" font-size="12" text-anchor="middle"
          fill="#b0b0b0">Rated PG-13 • English</text>
  </g>

  <!-- Bottom Accent Bar with Animation -->
  <g class="shimmer">
    <rect x="40" y="510" width="320" height="4" rx="2" fill="url(#titleGrad)"/>
  </g>

  <!-- Floating Particles (Optional) -->
  <g opacity="0.6">
    <circle cx="60" cy="550" r="2" fill="#ffeb3b" class="pulse-badge"/>
    <circle cx="200" cy="560" r="2" fill="#ff5252" class="pulse-badge"/>
    <circle cx="340" cy="545" r="2" fill="#ffeb3b" class="pulse-badge"/>
  </g>

  <!-- Badge Corner -->
  <g class="pulse-badge">
    <circle cx="370" cy="50" r="18" fill="#ff1744" filter="url(#shadowFilter)"/>
    <text x="370" y="58" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
          text-anchor="middle" fill="#ffffff">NEW</text>
  </g>
</svg>