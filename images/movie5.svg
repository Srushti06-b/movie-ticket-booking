<?xml version="1.0" encoding="utf-8"?>
<!-- Laugh Riot - animated comedy poster -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="g5" x1="0" x2="1">
      <stop offset="0%" stop-color="#14321a"/>
      <stop offset="50%" stop-color="#1f3d22"/>
      <stop offset="100%" stop-color="#08180f"/>
    </linearGradient>
    <style>
      .title { font: 700 40px/1 "Poppins", Arial, sans-serif; fill:#fff9e6; }
      .tag { font: 600 14px "Poppins", Arial, sans-serif; fill:#ffd166; }
      .laugh { font: 800 96px "Poppins", Arial, sans-serif; fill:#fff; opacity:0.9; }
    </style>
  </defs>

  <rect width="600" height="800" fill="url(#g5)"/>

  <!-- smiling spotlight -->
  <g transform="translate(300,300)">
    <ellipse rx="210" ry="140" fill="#ffd166" opacity="0.06"/>
    <ellipse rx="160" ry="100" fill="#ffb44b" opacity="0.04">
      <animate attributeName="rx" values="160;170;160" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <text x="-120" y="-10" class="laugh">HA!</text>
  </g>

  <!-- confetti animated -->
  <g>
    <rect x="80" y="140" width="8" height="18" fill="#ffd166" transform="rotate(15)">
      <animate attributeName="y" values="140;700" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="80;120" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="220" y="100" width="6" height="12" fill="#ff94c2" transform="rotate(-10)">
      <animate attributeName="y" values="100;720" dur="5.4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="220;260" dur="5.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="360" y="60" width="10" height="20" fill="#9ad6ff" transform="rotate(8)">
      <animate attributeName="y" values="60;740" dur="6.6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="360;320" dur="6.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- poster card -->
  <rect x="36" y="220" width="528" height="420" rx="12" fill="#081814" stroke="#ffffff" stroke-opacity="0.02"/>
  <text x="48" y="118" class="title">LAUGH</text>
  <text x="48" y="160" class="title">RIOT</text>
  <text x="48" y="220" class="tag">Comedy</text>

  <g transform="translate(48,300)" fill="#cfe3d0">
    <text x="0" y="40" font-size="16">Duration: 1h 40m</text>
    <text x="0" y="68" font-size="16">IMDb: ⭐ 7.1</text>
    <text x="0" y="96" font-size="16">Release: 2026-02-10</text>
    <text x="0" y="124" font-size="16">Language: Hindi</text>
  </g>

  <!-- laughing masks (animated) -->
  <g transform="translate(420,380)">
    <path d="M-40 10 C -30 -20 30 -20 40 10 C 30 36 -30 36 -40 10 Z" fill="#ffd166" opacity="0.95">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="
        M-40 10 C -30 -20 30 -20 40 10 C 30 36 -30 36 -40 10 Z;
        M-44 12 C -30 -18 34 -24 44 12 C 34 40 -34 40 -44 12 Z;
        M-40 10 C -30 -20 30 -20 40 10 C 30 36 -30 36 -40 10 Z"/>
    </path>
    <text x="-6" y="8" font-size="18" font-weight="700" fill="#081814" opacity="0.75">:)</text>
  </g>
</svg>
